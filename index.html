<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Rudraatara</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap');
      
      * { 
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      body { 
        margin: 0; 
        padding: 0; 
        overflow-x: hidden; 
        background: #020617; 
        overscroll-behavior-y: contain;
      }

      #root { 
        min-height: 100vh; 
        width: 100vw; 
        position: relative; 
        z-index: 10; 
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      /* Android-style touch feedback */
      .ripple-effect {
        position: relative;
        overflow: hidden;
      }
      
      /* Perspective for 3D Animations */
      .perspective-1000 { perspective: 1000px; }
      
      .mesh-bg {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
        z-index: 0;
      }
      .blob {
        position: absolute;
        width: 100vw; height: 100vw;
        background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
        filter: blur(100px);
        border-radius: 50%;
        opacity: 0.15;
        pointer-events: none;
        animation: rotate-blob 25s linear infinite;
      }
      @keyframes rotate-blob {
        from { transform: rotate(0deg) translate(20px) rotate(0deg); }
        to { transform: rotate(360deg) translate(20px) rotate(-360deg); }
      }
    </style>
  </head>
  <body>
    <div class="mesh-bg">
      <div class="blob" style="top: -10%; left: -10%;"></div>
      <div class="blob" style="bottom: -10%; right: -10%; background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
